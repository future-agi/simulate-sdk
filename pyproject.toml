[tool.poetry]
name = "agent-learning-kit-legacy-simulate-source"
version = "0.1.3"
description = "Legacy simulation source moved into agent-learning-kit; do not publish as agent-simulate."
authors = ["Future AGI <no-reply@futureagi.com>"]
license = "Apache-2.0"
readme = "README.md"
keywords = [
  "ai",
  "llm",
  "agents",
  "agent-testing",
  "voice-ai",
  "livekit",
  "simulation",
  "conversational-ai",
  "evaluation",
  "agent-evaluation",
  "transcript-analysis",
  "future-agi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [
  { include = "legacy_simulate_source_marker" }
]

[tool.poetry.urls]
"Homepage" = "https://futureagi.com"
"Documentation" = "https://docs.futureagi.com"
"Repository" = "https://github.com/future-agi/simulate-sdk"
"Issues" = "https://github.com/future-agi/simulate-sdk/issues"
"Changelog" = "https://github.com/future-agi/simulate-sdk/blob/main/CHANGELOG.md"
"Main platform" = "https://github.com/future-agi/future-agi"
"Discord" = "https://discord.gg/UjZ2gRT5p"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"

[tool.poetry.extras]
livekit = []
evaluation = []
all = []

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
