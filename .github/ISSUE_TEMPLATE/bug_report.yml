name: 🐛 Bug report
description: Something in the simulate-sdk isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as you can — it makes triage much faster.

        **Security issues:** please report privately to security@futureagi.com instead of opening a public issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: "I expected X, but Y happened instead."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A minimal script or link to a repo that reproduces the issue.
      render: python
      value: |
        import asyncio
        from fi.simulate import TestRunner, AgentDefinition, Scenario, Persona

        async def main():
            # ...
            pass

        asyncio.run(main())
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: dropdown
    id: mode
    attributes:
      label: Which mode?
      options:
        - Voice (LiveKit) — local
        - Text (Cloud) — orchestrated by Future AGI backend
        - Both
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SDK version
      description: "`pip show agent-simulate` → Version"
      placeholder: "e.g. 0.1.3"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.11.7"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, LiveKit server version (if applicable), agent framework (OpenAI / LangChain / Gemini / Anthropic)"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any stack traces or error output. Redact secrets and API keys.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checks
      options:
        - label: I searched [existing issues](https://github.com/future-agi/simulate-sdk/issues) and didn't find a duplicate
          required: true
        - label: I redacted any secrets, API keys, PII, or customer data from logs
          required: true
